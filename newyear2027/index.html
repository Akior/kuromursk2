<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Новый год начинается с тебя — уютная pixel-art история с ёлкой, котами и салютом."
    />
    <meta name="theme-color" content="#0d1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0d1220;
      }
      html {
        height: 100dvh;
      }
      body {
        /* Мобильный «полный экран»: адресная строка не сдвигает макет. */
        height: 100dvh;
        position: fixed;
        inset: 0;
        overflow: hidden;
        box-sizing: border-box;
        /* Вырез/динамический остров не перекрывает верхний HUD. */
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        /* Жесты отдаём игре: без прокрутки, зума и «резинки». */
        touch-action: none;
      }
      #root {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        touch-action: none;
        outline: none;
      }
    </style>
    <title>Новый год начинается с тебя</title>
    <script type="module" crossorigin src="./assets/index-DnZo3Zqn.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
